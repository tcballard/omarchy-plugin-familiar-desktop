name: Release binaries
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
permissions:
  contents: read
jobs:
  binaries:
    uses: ./.github/workflows/build-binaries.yml
  publish:
    # RCs retain their explicitly attached, tested bundles. Only final releases
    # receive the versioned assets used by the normal download installer.
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checks out the release tag: the pins and installers the smoke check
      # reads are the exact content onboarding downloads.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@v4
        with:
          name: familiar-desktop-release
          path: release-assets
      - name: Upload immutable versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release-assets/*
      - name: Smoke-check the public onboarding download URLs
        # A release whose assets never became downloadable is what broke v0.1.3
        # onboarding (issue #79); fail the run instead of shipping a 404.
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/verify-release-download.cjs --tag "$TAG" --repo "$GH_REPO"
