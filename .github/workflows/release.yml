name: Release binaries
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
permissions:
  contents: read
jobs:
  binaries:
    uses: ./.github/workflows/build-binaries.yml
  publish:
    # RCs retain their explicitly attached, tested bundles. Only final releases
    # receive the versioned assets used by the normal download installer.
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: familiar-desktop-release
          path: release-assets
      - name: Upload immutable versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release-assets/*
