name: Release binaries
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
permissions:
  contents: read
jobs:
  hyprbars:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install pinned Arch build environment
        run: |
          echo 'Server = https://archive.archlinux.org/repos/2026/09/30/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm
          pacman -S --needed --noconfirm base-devel git hyprland glaze
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.pull_request.head.sha || github.sha }}
      - run: bash scripts/build-hyprbars.sh
      - uses: actions/upload-artifact@v4
        with:
          name: familiar-hyprbars
          path: hyprbars-assets/*
          if-no-files-found: error
  build:
    needs: hyprbars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: x86_64-unknown-linux-musl
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y musl-tools lua5.4
      - name: Verify tag identity
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/verify-release-tag.cjs
      - name: Test and build static backend
        run: |
          cargo test --manifest-path backend/Cargo.toml --locked --release --target x86_64-unknown-linux-musl
          cargo build --manifest-path backend/Cargo.toml --locked --release --target x86_64-unknown-linux-musl
          readelf -l -d backend/target/x86_64-unknown-linux-musl/release/familiar-desktop > /tmp/familiar-elf.txt
          if awk '/NEEDED|INTERP/ {found=1} END {exit !found}' /tmp/familiar-elf.txt; then
            echo 'Release binary unexpectedly requires shared libraries' >&2
            exit 1
          fi
      - name: Record backend digest for source pin review
        run: sha256sum backend/target/x86_64-unknown-linux-musl/release/familiar-desktop
      - uses: actions/download-artifact@v4
        with:
          name: familiar-hyprbars
          path: hyprbars-assets
      - name: Package built assets
        id: package
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == release ]]; then
            node scripts/prepare-release.cjs backend/target/x86_64-unknown-linux-musl/release/familiar-desktop
          else
            node scripts/prepare-release.cjs backend/target/x86_64-unknown-linux-musl/release/familiar-desktop --ci
          fi
          node -e 'const fs = require("node:fs"); const manifest = JSON.parse(fs.readFileSync("release-assets/RELEASE-MANIFEST.json")); if (typeof manifest.sourcePinsMatch !== "boolean") throw new Error("Missing source pin readiness"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_pins_match=${manifest.sourcePinsMatch}\n`);'
      - name: Smoke test reviewed release bundle
        if: steps.package.outputs.source_pins_match == 'true'
        run: node tests/test_release_install.cjs
      - name: Smoke test validation-only bundle
        if: steps.package.outputs.source_pins_match == 'false'
        run: |
          echo 'Validation-only packaging: built assets differ from committed pins. This bundle is NOT release-ready and cannot be used for tagging or publication.'
          node tests/test_release_install.cjs --ci
      - name: Verify complete checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: steps.package.outputs.source_pins_match == 'true'
        with:
          name: familiar-desktop-release
          path: release-assets/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.package.outputs.source_pins_match == 'false'
        with:
          name: familiar-desktop-packaging-validation
          path: release-assets/*
          if-no-files-found: error
  publish:
    # RCs retain their explicitly attached, tested bundles. Only final releases
    # receive the versioned assets used by the normal download installer.
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: familiar-desktop-release
          path: release-assets
      - name: Upload immutable versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release-assets/*
