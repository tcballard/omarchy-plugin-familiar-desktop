name: Tag verified release
on:
  workflow_dispatch:
    inputs:
      rc_number:
        description: "RC number (for example 1); leave empty for a final tag only"
        required: false
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: tag-verified-release
  cancel-in-progress: false
jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require green main and create an immutable annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RC_NUMBER: ${{ inputs.rc_number }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_SHA"
          gh api "repos/$GH_REPO/actions/runs?head_sha=$SOURCE_SHA&event=push&per_page=100" > /tmp/release-runs.json
          for workflow in portable.yml release.yml; do
            jq -e --arg path ".github/workflows/$workflow" --arg sha "$SOURCE_SHA" '
              [.workflow_runs[] | select(.path == $path and .head_sha == $sha)]
              | sort_by(.id) | last
              | .status == "completed" and .conclusion == "success"
            ' /tmp/release-runs.json
          done
          version="$(jq -r .version manifest.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if [[ -n "$RC_NUMBER" ]]; then
            [[ "$RC_NUMBER" =~ ^[1-9][0-9]*$ ]]
            tag="$tag-rc.$RC_NUMBER"
            test -f "docs/$tag.md"
          fi
          git fetch origin --tags
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Tag $tag already exists; refusing to replace it." >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          run_id="$(jq -r --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.path == ".github/workflows/release.yml" and .head_sha == $sha)] | sort_by(.id) | last | .id' /tmp/release-runs.json)"
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "No successful release.yml run found for $SOURCE_SHA." >&2; exit 1; }
          if [[ -n "$RC_NUMBER" ]]; then
            gh run download "$run_id" --name familiar-desktop-release --dir /tmp/familiar-rc-assets
            (cd /tmp/familiar-rc-assets && sha256sum --check --strict SHA256SUMS)
            jq -e --arg sha "$SOURCE_SHA" --arg version "$version" '.source.commit == $sha and .version == $version' /tmp/familiar-rc-assets/RELEASE-MANIFEST.json
            jq -e --arg sha "$SOURCE_SHA" '.source.commit == $sha' /tmp/familiar-rc-assets/SOURCE-MANIFEST.json
            grep -Fx "candidate_sha='$SOURCE_SHA'" /tmp/familiar-rc-assets/install-candidate.sh
            grep -Fx "release_sha='$SOURCE_SHA'" /tmp/familiar-rc-assets/install.sh
            chmod u+x /tmp/familiar-rc-assets/familiar-desktop-linux-x86_64
            test "$(/tmp/familiar-rc-assets/familiar-desktop-linux-x86_64 --version)" = "familiar-desktop $version"
            bundle="familiar-$tag-linux-x86_64.zip"
            (cd /tmp/familiar-rc-assets && zip -q "/tmp/$bundle" *)
            (cd /tmp && sha256sum "$bundle" > "$bundle.sha256")
            cp "docs/$tag.md" /tmp/familiar-rc-notes.md
            printf '\nExact source: \x60%s\x60. [Verified main build](https://github.com/%s/actions/runs/%s).\n' "$SOURCE_SHA" "$GH_REPO" "$run_id" >> /tmp/familiar-rc-notes.md
            git tag -a "$tag" "$SOURCE_SHA" -m "Familiar $tag; verified main $SOURCE_SHA"
            git push origin "refs/tags/$tag"
            gh release create "$tag" --verify-tag --draft --prerelease --title "$tag" --notes-file /tmp/familiar-rc-notes.md "/tmp/$bundle" "/tmp/$bundle.sha256"
            gh release download "$tag" --dir /tmp/familiar-rc-download
            (cd /tmp/familiar-rc-download && sha256sum --check --strict "$bundle.sha256")
            cmp "/tmp/$bundle" "/tmp/familiar-rc-download/$bundle"
            gh release edit "$tag" --draft=false --prerelease --latest=false
            curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 --max-time 180 "https://github.com/$GH_REPO/releases/download/$tag/$bundle" -o /tmp/familiar-public-rc.zip
            cmp "/tmp/$bundle" /tmp/familiar-public-rc.zip
          else
          # A final tag without a published GitHub Release left v0.1.3 onboarding
          # downloading a 404 (issue #79). Publish the release from the prepared
          # notes, let the release workflow upload the versioned assets onboarding
          # downloads, then smoke-check the public URLs against the reviewed pins.
          test -f "docs/$tag.md"
          git tag -a "$tag" "$SOURCE_SHA" -m "Familiar $tag; verified main $SOURCE_SHA"
          git push origin "refs/tags/$tag"
          cp "docs/$tag.md" /tmp/familiar-release-notes.md
          printf '\nExact source: \x60%s\x60. [Verified main build](https://github.com/%s/actions/runs/%s).\n' "$SOURCE_SHA" "$GH_REPO" "$run_id" >> /tmp/familiar-release-notes.md
          gh release create "$tag" --verify-tag --draft --title "$tag" --notes-file /tmp/familiar-release-notes.md
          gh release edit "$tag" --draft=false --latest
          deadline="$((SECONDS + 1800))"
          while :; do
            names="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq '.assets[].name')"
            if [[ -z "$(comm -23 <(awk '{print $2}' release-binaries.sha256 | sort) <(sort <<<"$names"))" ]]; then break; fi
            if (( SECONDS >= deadline )); then echo "Timed out waiting for published release assets: $(awk '{print $2}' release-binaries.sha256 | tr '\n' ' ')" >&2; exit 1; fi
            sleep 30
          done
          node scripts/verify-release-download.cjs --tag "$tag" --repo "$GH_REPO"
          fi
