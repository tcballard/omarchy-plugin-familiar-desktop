name: Portable checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path backend/Cargo.toml
          git diff -- backend > /tmp/familiar-format.patch
          git diff --exit-code -- backend
      - name: Upload formatting diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: familiar-format-diagnostic
          path: /tmp/familiar-format.patch
      - run: tests/run
      - run: cargo fmt --manifest-path backend/Cargo.toml -- --check
      - run: cargo clippy --manifest-path backend/Cargo.toml --all-targets --locked -- -D warnings
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: familiar-desktop-linux-x86_64
          path: bin/familiar-desktop
      - name: Install Qt test runner
        run: sudo apt-get update && sudo apt-get install -y qt6-declarative-dev-tools qml6-module-qttest qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript
      - name: Run QML unit tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: /usr/lib/qt6/bin/qmltestrunner -input tests -import tests/imports
      - name: Parse plugin QML
        run: |
          for file in *.qml components/*.qml; do
            /usr/lib/qt6/bin/qmlformat "$file" > /dev/null
          done
